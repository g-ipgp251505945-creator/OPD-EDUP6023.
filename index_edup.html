<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DART TATABAHASA: Cabaran Kata Kerja</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800;900&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
            min-height: 100vh;
        }
        /* Latar Belakang Beranimasi (Digital Grid) */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }
        
        /* Meter 5 Warna (Luar Merah Gelap, Biru, Merah, Kuning, Coklat Bullseye) */
        .meter-bg {
            background: linear-gradient(to right, 
                #7f1d1d 0%, #7f1d1d 10%,    /* Luar Merah (Miss) */
                #3b82f6 10%, #3b82f6 25%,   /* Biru (10) */
                #ef4444 25%, #ef4444 40%,   /* Merah (20) */
                #eab308 40%, #eab308 47%,   /* Kuning (30) */
                #8b4513 47%, #8b4513 53%,   /* Coklat Bullseye (50) */
                #eab308 53%, #eab308 60%,   /* Kuning (30) */
                #ef4444 60%, #ef4444 75%,   /* Merah (20) */
                #3b82f6 75%, #3b82f6 90%,   /* Biru (10) */
                #7f1d1d 90%, #7f1d1d 100%   /* Luar Merah (Miss) */
            );
        }
        .dart-marker {
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                        top 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                        left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                        opacity 0.2s ease-in;
            filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.6));
            transform-origin: center bottom;
        }
        .player-active {
            box-shadow: 0 0 25px 5px rgba(59, 130, 246, 0.4);
            transform: translateY(-5px);
            border-color: #3b82f6 !important;
        }
        .player-active.p2 {
            box-shadow: 0 0 25px 5px rgba(16, 185, 129, 0.4);
            border-color: #10b981 !important;
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
        #action-btn {
            box-shadow: 0 10px 20px -10px rgba(234, 179, 8, 0.8);
            transition: all 0.2s ease;
        }
        #action-btn:active {
            box-shadow: 0 5px 10px -5px rgba(234, 179, 8, 0.8);
        }
        .pulse-error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4 relative">
    <div class="bg-grid"></div>

    <!-- SKRIN PENDAFTARAN NAMA -->
    <div id="registration-screen" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-500">
        <div class="glass-panel p-8 md:p-10 rounded-3xl max-w-md w-full text-center border-t-4 border-blue-500">
            <div class="inline-block p-4 bg-slate-800 rounded-full mb-4 shadow-inner border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">DART TATABAHASA</h1>
            <p class="text-slate-400 mb-8 font-semibold">Cabaran Kata Kerja Transitif & Tak Transitif</p>
            
            <div class="space-y-5 text-left">
                <div>
                    <label class="block text-sm text-slate-300 font-bold mb-2 ml-1">Nama Pemain 1</label>
                    <input type="text" id="input-p1" placeholder="Masukkan nama..." class="w-full px-5 py-4 bg-slate-800 border-2 border-slate-600 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none font-semibold text-white transition-all" required>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 font-bold mb-2 ml-1">Nama Pemain 2</label>
                    <input type="text" id="input-p2" placeholder="Masukkan nama..." class="w-full px-5 py-4 bg-slate-800 border-2 border-slate-600 rounded-xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 outline-none font-semibold text-white transition-all" required>
                </div>
            </div>

            <p id="reg-error" class="text-red-400 font-bold mt-4 h-6 opacity-0 transition-opacity text-sm">Sila isi kedua-dua nama pemain!</p>

            <button onclick="initGame()" class="w-full mt-4 py-4 bg-gradient-to-r from-blue-600 to-emerald-500 hover:from-blue-500 hover:to-emerald-400 text-white text-xl font-bold rounded-xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
                MULAKAN PERMAINAN
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </div>

    <!-- MAIN GAME UI -->
    <div id="game-ui" class="w-full max-w-5xl hidden flex-col items-center">
        
        <!-- Header & Scoreboard -->
        <div class="w-full flex flex-col md:flex-row justify-between items-stretch mb-8 gap-4">
            <!-- Pemain 1 -->
            <div id="p1-card" class="glass-panel border-2 border-slate-700 rounded-2xl p-5 w-full md:w-72 text-center transition-all duration-300 relative overflow-hidden flex flex-col justify-center">
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                <h2 class="text-lg font-bold text-slate-400 uppercase tracking-widest" id="name-p1">Pemain 1</h2>
                <p class="text-5xl font-black mt-1 text-white drop-shadow-md" id="score1">0</p>
            </div>
            
            <!-- Papan Maklumat -->
            <div class="text-center flex-1 glass-panel rounded-2xl py-4 px-6 border-2 border-slate-700 flex flex-col justify-center">
                <h1 class="text-3xl md:text-4xl font-black text-white tracking-wider drop-shadow-lg">
                    DART <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">TATABAHASA</span>
                </h1>
                <div class="inline-block mt-3 px-6 py-1.5 bg-slate-900 rounded-full border border-slate-600 shadow-inner">
                    <p class="text-slate-300 font-bold text-sm md:text-base">PUSINGAN <span id="round-display" class="text-yellow-400 text-xl mx-1">1</span> / 5</p>
                </div>
            </div>

            <!-- Pemain 2 -->
            <div id="p2-card" class="p2 glass-panel border-2 border-slate-700 rounded-2xl p-5 w-full md:w-72 text-center transition-all duration-300 relative overflow-hidden flex flex-col justify-center">
                <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                <h2 class="text-lg font-bold text-slate-400 uppercase tracking-widest" id="name-p2">Pemain 2</h2>
                <p class="text-5xl font-black mt-1 text-white drop-shadow-md" id="score2">0</p>
            </div>
        </div>

        <!-- Papan Dart Container -->
        <div class="relative bg-slate-800 p-6 rounded-full shadow-[0_0_50px_rgba(0,0,0,0.5)] mb-10 flex items-center justify-center border-8 border-slate-700" style="width: 360px; height: 360px;">
            <canvas id="dartboard" width="600" height="600" class="rounded-full shadow-inner" style="width: 100%; height: 100%;"></canvas>
            
            <!-- Dart Visual (SVG) -->
            <div id="dart" class="dart-marker absolute opacity-0 pointer-events-none z-10 w-12 h-24" style="top: 100%; left: 50%; margin-top: -80px; margin-left: -24px;">
                <svg viewBox="0 0 100 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="dartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#cbd5e1" />
                            <stop offset="50%" stop-color="#f8fafc" />
                            <stop offset="100%" stop-color="#94a3b8" />
                        </linearGradient>
                    </defs>
                    <path d="M50 0 L65 40 L55 40 L55 60 L45 60 L45 40 L35 40 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
                    <rect x="46" y="60" width="8" height="60" fill="url(#dartGrad)"/>
                    <rect x="42" y="100" width="16" height="30" fill="#334155" rx="3"/>
                    <rect x="40" y="105" width="20" height="4" fill="#eab308"/>
                    <rect x="40" y="115" width="20" height="4" fill="#eab308"/>
                    <path d="M46 130 L54 130 L50 200 Z" fill="#64748b"/>
                </svg>
            </div>

            <!-- Notifikasi Pantas (Miss) -->
            <div id="toast-miss" class="absolute bg-red-600 text-white font-black px-8 py-3 rounded-full border-4 border-slate-900 shadow-2xl opacity-0 transition-all duration-300 z-20 pointer-events-none transform -translate-y-4 scale-90 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                </svg>
                TERSASAR!
            </div>
        </div>

        <!-- Kawalan Meter Tunggal (Ketepatan) -->
        <div class="w-full max-w-xl glass-panel rounded-3xl p-6 md:p-8 border border-slate-600 relative overflow-hidden">
            <!-- Hiasan Latar -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
            
            <div id="status-text" class="text-center text-xl font-bold mb-8 text-yellow-400 bg-slate-900/80 py-3 rounded-xl border border-slate-700 glow-text shadow-inner">
                Bersedia untuk balingan!
            </div>

            <div class="mb-10">
                <div class="h-14 w-full rounded-full relative meter-bg shadow-[inset_0_5px_15px_rgba(0,0,0,0.8)] border-4 border-slate-800">
                    <div id="accuracy-cursor" class="absolute top-0 bottom-0 w-3 bg-white border-2 border-slate-900 shadow-[0_0_15px_rgba(255,255,255,1)] rounded-full -ml-1.5" style="left: 0%;"></div>
                </div>
                <div class="flex justify-between text-xs font-bold text-slate-500 mt-2 px-2">
                    <span>MISS</span>
                    <span>10</span>
                    <span>20</span>
                    <span>30</span>
                    <span class="text-yellow-500">BULLSEYE</span>
                    <span>30</span>
                    <span>20</span>
                    <span>10</span>
                    <span>MISS</span>
                </div>
            </div>

            <button id="action-btn" class="w-full py-5 bg-gradient-to-b from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-slate-900 text-2xl font-black rounded-2xl tracking-wider uppercase shadow-[0_8px_0_#a16207] hover:shadow-[0_4px_0_#a16207] hover:translate-y-1 active:shadow-[0_0px_0_#a16207] active:translate-y-2 transition-all flex justify-center items-center gap-3" onclick="handleAction()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                </svg>
                BERHENTI METER
            </button>
        </div>
    </div>

    <!-- Modal Soalan -->
    <div id="question-modal" class="fixed inset-0 bg-slate-900/95 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md">
        <div class="glass-panel w-full max-w-3xl rounded-3xl overflow-hidden shadow-2xl border border-slate-600 flex flex-col max-h-[95vh]">
            <div id="modal-header" class="p-6 md:p-8 text-center relative">
                <div class="absolute inset-0 bg-black/20 z-0"></div>
                <h3 id="modal-title" class="text-4xl font-black text-white relative z-10 drop-shadow-md">Soalan</h3>
                <p id="modal-subtitle" class="text-xl font-bold mt-2 text-white/90 relative z-10 bg-black/30 inline-block px-4 py-1 rounded-full"></p>
            </div>
            
            <div class="p-6 md:p-10 overflow-y-auto flex-1">
                <p id="question-text" class="text-2xl mb-10 font-medium leading-relaxed text-center text-slate-100">
                    Teks soalan...
                </p>
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Butang jawapan dijana secara automatik -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Keputusan Jawapan / Tamat Permainan -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900/95 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md">
        <div class="bg-slate-800 p-10 rounded-[2rem] max-w-lg w-full text-center border-4 relative overflow-hidden" id="result-box">
            <!-- Corak latar belakang untuk result -->
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent pointer-events-none"></div>
            
            <div id="result-icon" class="text-8xl mb-6 relative z-10 drop-shadow-lg filter">✨</div>
            <h2 id="result-title" class="text-5xl font-black mb-4 text-white relative z-10 tracking-tight">Betul!</h2>
            <div id="result-desc" class="text-lg text-slate-300 mb-10 font-medium relative z-10">Anda mendapat markah.</div>
            
            <button onclick="nextTurn()" id="result-btn" class="w-full py-5 bg-white text-slate-900 rounded-2xl font-black text-2xl hover:bg-slate-200 transition-all shadow-xl active:scale-95 relative z-10">
                Teruskan
            </button>
        </div>
    </div>

    <script>
        // --- 1. AUDIO SYNTH SETUP (Tone.js) ---
        let audioInitialized = false;
        const synths = {};

        async function initAudio() {
            if(audioInitialized) return;
            await Tone.start();
            
            synths.tick = new Tone.PolySynth(Tone.Synth).toDestination();
            synths.tick.set({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }, volume: -20 });
            
            synths.throw = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.05, decay: 0.4, sustain: 0 } }).toDestination();
            synths.throw.volume.value = -10;

            synths.thud = new Tone.MembraneSynth().toDestination();
            synths.thud.volume.value = -5;

            synths.correct = new Tone.PolySynth(Tone.Synth).toDestination();
            synths.correct.volume.value = -10;

            synths.wrong = new Tone.FMSynth().toDestination();
            synths.wrong.volume.value = -10;

            audioInitialized = true;
        }

        function playSound(type) {
            if(!audioInitialized) return;
            const now = Tone.now();
            switch(type) {
                case 'tick': synths.tick.triggerAttackRelease("C6", "32n"); break;
                case 'throw': synths.throw.triggerAttackRelease("8n"); break;
                case 'thud': synths.thud.triggerAttackRelease("C2", "8n"); break;
                case 'correct': 
                    synths.correct.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
                    synths.correct.triggerAttackRelease(["E4", "G4", "C5", "E5"], "4n", now + 0.15);
                    break;
                case 'wrong':
                    synths.wrong.triggerAttackRelease("D3", "8n", now);
                    synths.wrong.triggerAttackRelease("C#3", "8n", now + 0.15);
                    synths.wrong.triggerAttackRelease("C3", "2n", now + 0.3);
                    break;
                case 'win':
                    synths.correct.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                    synths.correct.triggerAttackRelease(["F4", "A4", "C5"], "8n", now + 0.2);
                    synths.correct.triggerAttackRelease(["G4", "B4", "D5"], "8n", now + 0.4);
                    synths.correct.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.6);
                    break;
            }
        }

        // --- STREAMING_CHUNK:Loading grammar questions... ---
        // --- 2. PANGKALAN DATA SOALAN TATABAHASA ---
        const originalQuestions = {
            zone1: [ // Zon 1 (Coklat / Bullseye) - 50 Markah
                { q: "Pilih ayat yang mengandungi kata kerja tak transitif berpelengkap.", options: ["Adik sedang tidur.", "Pemuda itu menjadi guru.", "Burung berterbangan di udara.", "Ibu membasuh baju."], answer: 1 },
                { q: "Antara berikut, yang manakah merupakan kata kerja transitif?", options: ["Tersenyum", "Membaca", "Berjalan", "Tidur"], answer: 1 },
                { q: "Apakah yang membezakan kata kerja transitif dengan kata kerja tak transitif?", options: ["KKT perlukan objek, KKTT tidak", "KKTT perlukan objek, KKT tidak", "Kedua-duanya sama", "KKT hanya untuk benda hidup"], answer: 0 },
                { q: "\"Penyanyi itu menyanyikan sebuah lagu yang merdu.\" Kata kerja dalam ayat ini ialah...", options: ["Kata kerja tak transitif", "Kata kerja transitif", "Kata bantu", "Kata adjektif"], answer: 1 },
                { q: "Pilih ayat yang menggunakan kata kerja transitif dengan betul.", options: ["Dia sedang memotong sayur.", "Kucing itu melompat tinggi.", "Bapa sedang berehat.", "Bayi itu menangis kuat."], answer: 0 }
            ],
            zone2: [ // Zon 2 (Kuning) - 30 Markah
                { q: "\"Pokok itu tumbang akibat angin kencang.\" Apakah jenis kata kerja 'tumbang'?", options: ["Transitif", "Tak Transitif Tanpa Pelengkap", "Tak Transitif Berpelengkap", "Pasif"], answer: 1 },
                { q: "Manakah antara berikut merupakan kata kerja tak transitif berpelengkap?", options: ["Menetap", "Mencuci", "Melukis", "Menulis"], answer: 0 },
                { q: "\"Kakak sedang menyapu sampah.\" Perkataan menyapu ialah...", options: ["Kata Kerja Tak Transitif", "Kata Kerja Transitif", "Kata Nama", "Kata Tugas"], answer: 1 },
                { q: "Kata kerja tak transitif tanpa pelengkap bermaksud...", options: ["Boleh berdiri sendiri tanpa objek", "Mesti diikuti oleh objek", "Mesti diikuti oleh kata adjektif", "Memerlukan penyambut"], answer: 0 }
            ],
            zone3: [ // Zon 3 (Merah) - 20 Markah
                { q: "\"Adik menangis.\" Perkataan menangis merupakan...", options: ["Kata Kerja Transitif", "Kata Kerja Tak Transitif", "Kata Seru", "Kata Hubung"], answer: 1 },
                { q: "Kata kerja transitif mesti diikuti oleh...", options: ["Objek (Kata Nama)", "Kata Adjektif", "Kata Kerja lain", "Kata Sendi Nama"], answer: 0 },
                { q: "Antara berikut, manakah ayat yang mengandungi kata kerja tak transitif?", options: ["Ali menendang bola.", "Burung itu terbang.", "Siti menyiram bunga.", "Ayah mencuci kereta."], answer: 1 },
                { q: "Semua di bawah adalah kata kerja transitif, KECUALI...", options: ["Membeli", "Menjual", "Membaca", "Senyum"], answer: 3 }
            ],
            zone4: [ // Zon 4 (Biru) - 10 Markah
                { q: "Kata kerja terbahagi kepada berapa jenis utama dalam topik ini?", options: ["Dua (Transitif & Tak Transitif)", "Tiga", "Empat", "Satu"], answer: 0 },
                { q: "\"Ibu memasak nasi.\" Perkataan 'memasak' memerlukan 'nasi' sebagai objek. Ini ialah...", options: ["Kata Kerja Transitif", "Kata Kerja Tak Transitif", "Kata Ganda", "Kata Pinjaman"], answer: 0 },
                { q: "\"Datuk sedang tidur di bilik.\" Apakah jenis kata kerja bagi 'tidur'?", options: ["Kata Kerja Tak Transitif", "Kata Kerja Transitif", "Kata Adjektif", "Kata Sendi"], answer: 0 },
                { q: "Manakah perkataan berikut merupakan kata kerja?", options: ["Buku", "Cantik", "Berlari", "Dengan"], answer: 2 }
            ]
        };

        let activeQuestions = {
            zone1: [...originalQuestions.zone1],
            zone2: [...originalQuestions.zone2],
            zone3: [...originalQuestions.zone3],
            zone4: [...originalQuestions.zone4]
        };

        // --- STREAMING_CHUNK:Defining game logic... ---
        // --- 3. PEMBOLEH UBAH PERMAINAN & STATE ---
        let p1Name = "";
        let p2Name = "";
        let currentPlayer = 1;
        let scores = { 1: 0, 2: 0 };
        let currentRound = 1;
        const maxRounds = 5;
        
        let gameState = 'IDLE'; 
        let meterValue = 0;
        let meterDirection = 1;
        let meterSpeed = 0.08; 
        let animationFrameId;
        let lastTime = 0;
        let lastTickValue = 0; 
        let lockedAccuracy = 0;
        let currentZoneHit = 0;
        let currentQuestion = null;
        let marksToGain = 0;

        const accuracyCursor = document.getElementById('accuracy-cursor');
        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const dartElement = document.getElementById('dart');

        // --- 4. LUKIS PAPAN DART (Canvas) ---
        const canvas = document.getElementById('dartboard');
        const ctx = canvas.getContext('2d');
        const centerX = 300;
        const centerY = 300;

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            function drawRing(radius, fill, stroke, width = 4) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fill;
                ctx.fill();
                ctx.lineWidth = width;
                ctx.strokeStyle = stroke;
                ctx.stroke();
            }

            drawRing(280, '#1e293b', '#0f172a', 10); 
            drawRing(260, '#3b82f6', '#1d4ed8', 4);
            drawRing(190, '#ef4444', '#b91c1c', 4);
            drawRing(120, '#eab308', '#a16207', 4);
            drawRing(50, '#8b4513', '#451a03', 4);
            drawRing(20, '#dc2626', '#991b1b', 2);

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            for(let i=0; i<20; i++) {
                let angle = (i * 18) * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(centerX + Math.cos(angle)*50, centerY + Math.sin(angle)*260);
                ctx.lineTo(centerX + Math.cos(angle)*260, centerY + Math.sin(angle)*260);
                ctx.stroke();
            }
        }
        drawBoard();

        // --- 5. LOGIK UI & KAWALAN PERMAINAN ---
        async function initGame() {
            const i1 = document.getElementById('input-p1').value.trim();
            const i2 = document.getElementById('input-p2').value.trim();
            const err = document.getElementById('reg-error');

            if (!i1 || !i2) {
                err.style.opacity = '1';
                document.querySelector('.glass-panel').classList.add('pulse-error');
                setTimeout(() => document.querySelector('.glass-panel').classList.remove('pulse-error'), 400);
                return;
            }
            
            await initAudio(); 
            p1Name = i1;
            p2Name = i2;
            
            document.getElementById('name-p1').innerText = p1Name;
            document.getElementById('name-p2').innerText = p2Name;
            
            document.getElementById('registration-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('registration-screen').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                document.getElementById('game-ui').classList.add('flex');
                startTurn();
            }, 500);
        }

        function updateMeter(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === 'RUNNING') {
                meterValue += meterDirection * (meterSpeed * deltaTime);
                
                if (meterValue >= 100) {
                    meterValue = 100;
                    meterDirection = -1;
                } else if (meterValue <= 0) {
                    meterValue = 0;
                    meterDirection = 1;
                }
                
                accuracyCursor.style.left = meterValue + '%';

                if (Math.abs(meterValue - lastTickValue) > 5) {
                    playSound('tick');
                    lastTickValue = meterValue;
                }
                animationFrameId = requestAnimationFrame(updateMeter);
            }
        }

        function startTurn() {
            gameState = 'RUNNING';
            meterValue = 10 + Math.random() * 80; 
            lastTime = 0;
            
            const activeName = currentPlayer === 1 ? p1Name : p2Name;
            
            actionBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                </svg> BERHENTI METER
            `;
            actionBtn.className = "w-full py-5 bg-gradient-to-b from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-slate-900 text-2xl font-black rounded-2xl tracking-wider uppercase shadow-[0_8px_0_#a16207] hover:shadow-[0_4px_0_#a16207] hover:translate-y-1 active:shadow-[0_0px_0_#a16207] active:translate-y-2 transition-all flex justify-center items-center gap-3";
            actionBtn.disabled = false;
            
            statusText.innerHTML = `Giliran <span class="${currentPlayer === 1 ? 'text-blue-400' : 'text-emerald-400'}">${activeName}</span>. Tekan butang!`;
            
            dartElement.style.transition = 'none';
            dartElement.style.opacity = '0';
            dartElement.style.transform = 'scale(3) rotate(15deg)';
            dartElement.style.top = '120%';
            dartElement.style.left = '50%';

            document.getElementById('toast-miss').style.opacity = '0';
            document.getElementById('toast-miss').style.transform = 'translateY(-20px) scale(0.9)';

            updatePlayerHighlight();

            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(updateMeter);
        }

        function handleAction() {
            if (gameState === 'RUNNING') {
                gameState = 'THROWING';
                lockedAccuracy = meterValue;
                
                actionBtn.innerHTML = `<span class="animate-pulse">MEMBALING...</span>`;
                actionBtn.className = "w-full py-5 bg-slate-600 text-slate-400 text-2xl font-black rounded-2xl tracking-wider uppercase shadow-none transition-all flex justify-center items-center cursor-not-allowed";
                actionBtn.disabled = true;
                
                processThrow();
            }
        }

        // --- STREAMING_CHUNK:Implementing throwing mechanics... ---
        // --- 6. LOGIK BALINGAN & KOORDINAT ---
        function processThrow() {
            playSound('throw');
            let targetDist = 0;

            if (lockedAccuracy < 10 || lockedAccuracy > 90) {
                currentZoneHit = 0; 
                marksToGain = 0;
                targetDist = 320; 
            } else if (lockedAccuracy < 25 || lockedAccuracy > 75) {
                currentZoneHit = 4; 
                marksToGain = 10;
                targetDist = 200 + Math.random() * 50; 
            } else if (lockedAccuracy < 40 || lockedAccuracy > 60) {
                currentZoneHit = 3; 
                marksToGain = 20;
                targetDist = 130 + Math.random() * 50;
            } else if (lockedAccuracy < 47 || lockedAccuracy > 53) {
                currentZoneHit = 2; 
                marksToGain = 30;
                targetDist = 60 + Math.random() * 50;
            } else {
                currentZoneHit = 1; 
                marksToGain = 50;
                targetDist = Math.random() * 40;
            }

            const angle = Math.random() * 2 * Math.PI;
            
            const ratio = 0.6;
            const containerRadius = 180;
            
            const targetX = containerRadius + Math.cos(angle) * (targetDist * ratio);
            const targetY = containerRadius + Math.sin(angle) * (targetDist * ratio);

            const cssLeft = (targetX / 360) * 100;
            const cssTop = (targetY / 360) * 100;

            animateDart(cssLeft, cssTop);

            setTimeout(() => {
                playSound('thud');
                
                const boardContainer = document.querySelector('#dartboard').parentElement;
                boardContainer.classList.add('pulse-error');
                setTimeout(() => boardContainer.classList.remove('pulse-error'), 400);

                if (currentZoneHit === 0) {
                    showMissToast();
                } else {
                    setTimeout(() => prepareQuestion(currentZoneHit, marksToGain), 600);
                }
            }, 500); 
        }

        function animateDart(leftPct, topPct) {
            void dartElement.offsetWidth;
            
            dartElement.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.1s ease-in';
            dartElement.style.opacity = '1';
            dartElement.style.left = `${leftPct}%`;
            dartElement.style.top = `${topPct}%`;
            
            const rotateFactor = (leftPct - 50) * 0.5;
            dartElement.style.transform = `scale(0.8) rotate(${rotateFactor}deg)`;
        }

        function showMissToast() {
            const toast = document.getElementById('toast-miss');
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0) scale(1)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                nextTurn();
            }, 2000);
        }

        // --- STREAMING_CHUNK:Managing turns and scoring... ---
        // --- 7. LOGIK SOALAN & JAWAPAN ---
        function prepareQuestion(zone, marks) {
            gameState = 'QUESTION';
            let zoneKey = 'zone' + zone;
            let pool = activeQuestions[zoneKey];
            
            if (pool.length === 0) {
                activeQuestions[zoneKey] = [...originalQuestions[zoneKey]];
                pool = activeQuestions[zoneKey];
            }

            let headerColors = "";
            let zoneName = "";
            if (zone === 1) { zoneName = "Zon Bullseye"; headerColors = "bg-gradient-to-r from-yellow-700 to-yellow-900"; }
            else if (zone === 2) { zoneName = "Zon Kuning"; headerColors = "bg-gradient-to-r from-yellow-400 to-orange-500"; }
            else if (zone === 3) { zoneName = "Zon Merah"; headerColors = "bg-gradient-to-r from-red-500 to-red-700"; }
            else { zoneName = "Zon Biru"; headerColors = "bg-gradient-to-r from-blue-500 to-blue-700"; }

            const randIndex = Math.floor(Math.random() * pool.length);
            currentQuestion = pool[randIndex];
            pool.splice(randIndex, 1); 

            const modalHeader = document.getElementById('modal-header');
            modalHeader.className = `p-6 md:p-8 text-center relative ${headerColors}`;
            
            document.getElementById('modal-title').innerText = `Peluang ${marks} Markah!`;
            document.getElementById('modal-subtitle').innerText = zoneName;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            currentQuestion.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 bg-slate-800 hover:bg-slate-700 rounded-2xl text-lg font-bold transition-all border-2 border-slate-600 hover:border-blue-400 shadow-md hover:-translate-y-1 active:translate-y-0 group flex items-center gap-4";
                btn.innerHTML = `
                    <span class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-slate-900 rounded-full text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-colors border border-slate-600">${letters[index]}</span>
                    <span>${opt}</span>
                `;
                btn.onclick = () => submitAnswer(index, marks);
                optionsContainer.appendChild(btn);
            });

            const qModal = document.getElementById('question-modal');
            qModal.classList.remove('hidden');
            
            qModal.querySelector('.glass-panel').style.transform = 'scale(0.9)';
            qModal.querySelector('.glass-panel').style.opacity = '0';
            setTimeout(() => {
                qModal.querySelector('.glass-panel').style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                qModal.querySelector('.glass-panel').style.transform = 'scale(1)';
                qModal.querySelector('.glass-panel').style.opacity = '1';
            }, 10);
        }

        function submitAnswer(selectedIndex, marks) {
            document.getElementById('question-modal').classList.add('hidden');
            
            const rBox = document.getElementById('result-box');
            const rIcon = document.getElementById('result-icon');
            const rTitle = document.getElementById('result-title');
            const rDesc = document.getElementById('result-desc');

            if (selectedIndex === currentQuestion.answer) {
                playSound('correct');
                shootConfetti();
                scores[currentPlayer] += marks;
                updateScoreboard();
                
                rBox.className = "bg-emerald-600 p-10 rounded-[2rem] max-w-lg w-full text-center border-4 border-emerald-300 shadow-[0_0_50px_rgba(16,185,129,0.5)] relative overflow-hidden transform transition-all";
                rIcon.innerText = "🎯";
                rTitle.innerText = "Tepat Sekali!";
                rDesc.innerText = `Tahniah! Anda berjaya mengumpul ${marks} markah.`;
            } else {
                playSound('wrong');
                rBox.className = "bg-red-600 p-10 rounded-[2rem] max-w-lg w-full text-center border-4 border-red-300 shadow-[0_0_50px_rgba(239,68,68,0.5)] relative overflow-hidden transform transition-all";
                rIcon.innerText = "❌";
                rTitle.innerText = "Kurang Tepat!";
                rDesc.innerHTML = `Jawapan yang betul ialah:<br><span class="text-white font-black text-2xl mt-3 block bg-black/20 p-4 rounded-xl">${currentQuestion.options[currentQuestion.answer]}</span><br><span class="text-white/80 font-bold mt-2 block">0 Markah ditambah.</span>`;
            }

            const rModal = document.getElementById('result-modal');
            rModal.classList.remove('hidden');
            
            rBox.style.transform = 'scale(0.8)';
            setTimeout(() => {
                rBox.style.transform = 'scale(1)';
            }, 10);
        }

        function shootConfetti() {
            var duration = 2000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#3b82f6', '#10b981', '#facc15']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#3b82f6', '#10b981', '#facc15']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // --- 8. PENGURUSAN PUSINGAN & TAMAT ---
        function updateScoreboard() {
            const s1 = document.getElementById('score1');
            const s2 = document.getElementById('score2');
            
            if(s1.innerText != scores[1]) {
                s1.innerText = scores[1];
                s1.classList.add('text-yellow-400', 'scale-125');
                setTimeout(() => s1.classList.remove('text-yellow-400', 'scale-125'), 300);
            }
            if(s2.innerText != scores[2]) {
                s2.innerText = scores[2];
                s2.classList.add('text-yellow-400', 'scale-125');
                setTimeout(() => s2.classList.remove('text-yellow-400', 'scale-125'), 300);
            }
        }

        function updatePlayerHighlight() {
            const p1Card = document.getElementById('p1-card');
            const p2Card = document.getElementById('p2-card');
            
            p1Card.classList.toggle('player-active', currentPlayer === 1);
            p2Card.classList.toggle('player-active', currentPlayer === 2);
            
            if(currentPlayer === 1) {
                p1Card.classList.remove('opacity-50');
                p2Card.classList.add('opacity-50', 'scale-95');
                p1Card.classList.remove('scale-95');
            } else {
                p2Card.classList.remove('opacity-50');
                p1Card.classList.add('opacity-50', 'scale-95');
                p2Card.classList.remove('scale-95');
            }
        }

        function nextTurn() {
            document.getElementById('result-modal').classList.add('hidden');
            
            if (currentPlayer === 1) {
                currentPlayer = 2;
                startTurn();
            } else {
                currentPlayer = 1;
                currentRound++;
                
                if (currentRound > maxRounds) {
                    endGame();
                } else {
                    document.getElementById('round-display').innerText = currentRound;
                    
                    const rd = document.getElementById('round-display').parentElement;
                    rd.classList.add('bg-white');
                    setTimeout(() => rd.classList.remove('bg-white'), 200);

                    startTurn();
                }
            }
        }

        function endGame() {
            gameState = 'END';
            playSound('win');
            shootConfetti(); 
            setTimeout(shootConfetti, 1000);
            
            let winnerName = "";
            let winColor = "";

            if (scores[1] > scores[2]) {
                winnerName = p1Name;
                winColor = "text-blue-400";
            } else if (scores[2] > scores[1]) {
                winnerName = p2Name;
                winColor = "text-emerald-400";
            } else {
                winnerName = "SERI!";
                winColor = "text-yellow-400";
            }

            const rBox = document.getElementById('result-box');
            rBox.className = "bg-slate-900 p-10 rounded-[2rem] max-w-2xl w-full text-center border-4 border-yellow-500 shadow-[0_0_80px_rgba(234,179,8,0.6)] relative overflow-hidden";
            
            document.getElementById('result-title').innerText = "Tamat Permainan!";
            document.getElementById('result-title').classList.add('text-yellow-400');
            
            let descHtml = `
                <div class="flex justify-center items-center gap-8 mb-8 mt-6">
                    <div class="bg-slate-800 p-4 rounded-xl border border-blue-500/50 w-40">
                        <p class="text-sm text-slate-400 font-bold truncate">${p1Name}</p>
                        <p class="text-4xl font-black text-blue-400">${scores[1]}</p>
                    </div>
                    <div class="text-3xl font-black text-slate-500">VS</div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-emerald-500/50 w-40">
                        <p class="text-sm text-slate-400 font-bold truncate">${p2Name}</p>
                        <p class="text-4xl font-black text-emerald-400">${scores[2]}</p>
                    </div>
                </div>
                <p class="text-slate-300 mb-2 uppercase tracking-widest text-sm font-bold">Juara Tatabahasa adalah</p>
                <div class="text-5xl md:text-6xl font-black ${winColor} tracking-wide uppercase mb-8 drop-shadow-lg">${winnerName}</div>
            `;
            
            document.getElementById('result-desc').innerHTML = descHtml;
            document.getElementById('result-icon').innerText = "🏆";
            document.getElementById('result-icon').classList.add('animate-bounce');
            
            const btn = document.getElementById('result-btn');
            btn.innerHTML = `
                Main Semula
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block ml-2 -mt-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            `;
            btn.className = "w-full py-5 bg-gradient-to-r from-yellow-500 to-yellow-400 text-slate-900 rounded-2xl font-black text-2xl hover:from-yellow-400 hover:to-yellow-300 transition-all shadow-[0_8px_0_#a16207] active:shadow-[0_0px_0_#a16207] active:translate-y-2 relative z-10";
            btn.onclick = () => location.reload();
            
            document.getElementById('result-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
